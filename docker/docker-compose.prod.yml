# 本番（VPS1台）構成: Caddy(自動HTTPS) → frontend / backend、DBはSQLite。
# 使い方:
#   1) docker/.env を用意（DOMAIN, JWT_SECRET など。.env.prod.example 参照）
#   2) cd docker && docker compose -f docker-compose.prod.yml --env-file .env up -d --build
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
      - sns
    # edge: 別リポジトリ(/opt/sns-pipeline)のTenYen Webhookコンテナへ /tenyen/* を
    # 流すための外部ネットワーク（VPSで docker network create edge を1回実行）。
    networks:
      - default
      - edge

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      # SQLite を永続ボリュームに置く
      DATABASE_URL: "sqlite:////data/app.db"
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECURE: "true"
      COOKIE_SAMESITE: "lax"
      CORS_ORIGINS: "https://${DOMAIN}"
      ENABLE_YOUTUBE_REFERENCE: ${ENABLE_YOUTUBE_REFERENCE:-false}
      # ソラ先生の自然言語チャット応答（Gemini。空ならルールベースにフォールバック）
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # モデルIDは全て env で上書き可にしておく（docs/92）。Google 側の都合でモデルが
      # 予告なく 404/400 になった時、再デプロイを待たず docker/.env の1行＋再起動で
      # 載せ替えられるようにするため。既定値はコード側（app/core/config.py）に置き、
      # ここでは空なら未設定として扱う（compose の既定値でコード既定を隠さない）。
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_CHAT_MODEL: ${LLM_CHAT_MODEL:-}
      LLM_AUDIO_MODEL: ${LLM_AUDIO_MODEL:-}
      LLM_ANALYSIS_MODEL: ${LLM_ANALYSIS_MODEL:-}
      # 音声入力の thinking/出力枠。世代を跨ぐ載せ替え時の調整用（docs/92 §2-3）
      LLM_AUDIO_THINKING_BUDGET: ${LLM_AUDIO_THINKING_BUDGET:-}
      LLM_AUDIO_MAX_TOKENS: ${LLM_AUDIO_MAX_TOKENS:-}
      UPLOADS_DIR: "/data/uploads"
      COACH_AUDIO_DIR: "/data/uploads/coach"
      REFERENCE_CACHE_DIR: "/data/uploads/reference"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      # --- Stripe課金（docs/31）。値は docker/.env から注入 ---
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PRICE_ID_PREMIUM: ${STRIPE_PRICE_ID_PREMIUM:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      BILLING_ENABLED: ${BILLING_ENABLED:-false}
      FRONTEND_BASE_URL: "https://${DOMAIN}"
      # --- ウェルカムメール（docs/84/85）。値は docker/.env から注入。空なら送信スキップ ---
      MAIL_API_KEY: ${MAIL_API_KEY:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
    volumes:
      - app_data:/data

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.prod
      args:
        # 同一ドメイン配信なので API もそのドメイン（Caddy が /api を backend へ）
        NEXT_PUBLIC_API_BASE_URL: "https://${DOMAIN}"
        # OG画像の絶対URL生成に使うサイト origin（同一ドメイン）
        NEXT_PUBLIC_SITE_URL: "https://${DOMAIN}"
        # Cloudflare Web Analytics のビーコントークン（未設定なら計測タグは出ない）
        NEXT_PUBLIC_CF_BEACON_TOKEN: "${CF_BEACON_TOKEN:-}"
        # PWAプッシュ購読に必要なVAPID公開鍵（ビルド時にJSへ埋め込む）。空なら通知トグルは非表示。
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: "${VAPID_PUBLIC_KEY:-}"
    restart: unless-stopped

  # SNS投稿のLINE承認Webhook（本体バックエンドとは独立）。
  # Caddy が /sns/* をここへ流す。投稿の生成cronは
  #   docker compose -f docker-compose.prod.yml exec sns python generate_and_post.py --slot 1
  # のように叩く（承認キュー・投稿ログをこのコンテナ内で共有するため）。
  sns:
    build:
      context: ../scripts/sns_autopost
      dockerfile: Dockerfile
    restart: unless-stopped
    # LINE/X/Geminiのキーや APPROVAL_MODE 等は scripts/sns_autopost/.env から読む
    # （未作成でも他サービスを止めないよう required:false。snsを使う前に必ず作成する）
    env_file:
      - path: ../scripts/sns_autopost/.env
        required: false
    environment:
      WEBHOOK_PORT: "8088"
      # 承認キュー・投稿ログ・メトリクスを永続volumeに書く
      SNS_DATA_DIR: "/data"
      # 1日3投稿（朝8/昼12/夜21。2026-08-01 運用者決定）。compose の environment は
      # env_file(.env) より優先されるため、VPSの .env に残る MAX_POSTS_PER_DAY=2 を
      # SSHなしで上書きできる。値を変えるときは .env ではなくここを変える。
      MAX_POSTS_PER_DAY: "3"
    volumes:
      - sns_data:/data

volumes:
  caddy_data:
  caddy_config:
  app_data:
  sns_data:

networks:
  edge:
    external: true
