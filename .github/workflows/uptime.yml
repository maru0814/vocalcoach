# 死活監視（外形監視・docs/62 の前提条件 / docs/60 追記参照）
#
# なぜ GitHub Actions か: 7/11〜7/14 の約3日停止は VPS 自体の電源断で、
# VPS 上の cron では原理的に検知できない（cron ごと止まるため）。
# 監視は必ず VPS の外に置く。スケジュール実行はデフォルトブランチ(main)のみ有効。
#
# 通知経路（2段）:
#   1. GitHub Issue（主経路・GITHUB_TOKENのみで動く）: 障害でIssueを開く→メール通知。
#      復旧でクローズ。Issueの開閉が状態管理を兼ねる（継続中の再通知は6時間毎コメント）。
#   2. LINE（任意・即時性）: repo secrets LINE_CHANNEL_ACCESS_TOKEN /
#      LINE_OPERATOR_USER_ID が登録されていれば併送。未登録ならスキップ。
#      ※PATにsecrets権限が無いためCLIから登録不可。人間がWeb UIで登録する（docs/60）。
name: Uptime monitor

on:
  schedule:
    - cron: "*/15 * * * *"  # 実際は数分遅延しうる（GitHub仕様）。死活監視には十分
  workflow_dispatch:
    inputs:
      test_alert:
        description: "通知経路の疎通テスト（LINE強制送信）"
        default: false
        type: boolean

permissions:
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      LINE_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_TO: ${{ secrets.LINE_OPERATOR_USER_ID }}
      TEST_ALERT: ${{ inputs.test_alert }}
    steps:
      - name: Check endpoints and notify
        run: |
          set -u
          URLS=(
            "https://sora-vocal-ai.duckdns.org/"
            "https://sora-vocal-ai.duckdns.org/api/v1/voice-type/stats"
            "https://sora-vocal-ai.duckdns.org/sns/healthz"
          )

          push_line() {  # $1 = message（LINE未設定なら黙ってスキップ）
            [ -n "${LINE_TOKEN}" ] && [ -n "${LINE_TO}" ] || { echo "LINE未設定: スキップ"; return 0; }
            curl -sS -m 15 -X POST https://api.line.me/v2/bot/message/push \
              -H "Authorization: Bearer ${LINE_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg to "$LINE_TO" --arg text "$1" \
                    '{to:$to, messages:[{type:"text", text:$text}]}')" \
              -o /dev/null -w "LINE push HTTP %{http_code}\n" || true
          }

          if [ "${TEST_ALERT}" = "true" ]; then
            push_line "🔔 死活監視テスト: この通知が届けばLINE経路は正常です（uptime.yml）"
          fi

          failed=""
          for url in "${URLS[@]}"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 20 "$url" || echo 000)
            if [ "$code" != "200" ]; then
              sleep 20  # 一過性のゆらぎを1回だけ吸収（誤報防止）
              code=$(curl -s -o /dev/null -w '%{http_code}' -m 20 "$url" || echo 000)
            fi
            echo "$url => $code"
            [ "$code" = "200" ] || failed="${failed}・${url} (HTTP ${code})"$'\n'
          done

          # ラベルは冪等に用意（初回だけ作成される）
          gh label create uptime -R "$REPO" --color FF0000 \
            --description "死活監視の障害Issue" 2>/dev/null || true

          open_issue=$(gh issue list -R "$REPO" --label uptime --state open \
                       --json number,updatedAt --jq '.[0] // empty')
          issue_no=$(jq -r '.number // empty' <<<"$open_issue" 2>/dev/null || true)

          if [ -n "$failed" ]; then
            echo "status=down (open issue: ${issue_no:-none})"
            body="$(printf '🚨 本番サイトが応答しません（死活監視）\n\n%s\n対応: docs/60 のプレイブック参照。curl→SSH→docker compose ps の順。SSH不可なら ConoHa コンソールで電源確認（人間作業）。' "$failed")"
            if [ -z "$issue_no" ]; then
              gh issue create -R "$REPO" --label uptime \
                --title "🚨 本番停止検知 $(date -u -d '+9 hours' '+%Y-%m-%d %H:%M') JST" \
                --body "$body"
              push_line "$body"
            else
              # 継続中: 前回更新から6時間経過時のみ再通知（メール/LINEのノイズ抑制）
              updated=$(jq -r '.updatedAt' <<<"$open_issue")
              if [ $(( $(date +%s) - $(date -d "$updated" +%s) )) -ge 21600 ]; then
                gh issue comment "$issue_no" -R "$REPO" --body "⏱ 障害継続中（$(date -u -d '+9 hours' '+%H:%M') JST 時点）"$'\n'"$body"
                push_line "$body"
              fi
            fi
            exit 1  # runを赤にして gh run list でも追えるようにする
          else
            echo "status=up (open issue: ${issue_no:-none})"
            if [ -n "$issue_no" ]; then
              msg="✅ 本番サイト復旧を確認（全3エンドポイント200）。gh run list --workflow deploy.yml で silent なデプロイ失敗の積み上がりも確認すること（docs/60 教訓2）"
              gh issue comment "$issue_no" -R "$REPO" --body "$msg"
              gh issue close "$issue_no" -R "$REPO"
              push_line "$msg"
            fi
          fi
